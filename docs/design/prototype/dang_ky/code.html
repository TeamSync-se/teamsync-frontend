<div class="flex flex-col items-center mb-6">
<div class="flex items-center gap-3 mb-3">
<div class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-primary-container text-white shadow-sm"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div>
<span class="font-headline-lg text-headline-lg text-primary-text font-bold tracking-tight">TeamSync</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary-text font-semibold">Tạo tài khoản</h1>
<p class="font-body-md text-body-md text-secondary-text mt-1 text-center">Nền tảng hỗ trợ làm việc nhóm trực tuyến hiệu quả</p>
</div>
<form class="space-y-4" id="signup-form" onsubmit="event.preventDefault();">
<div>
<label class="block font-label-md text-label-md text-primary-text font-medium mb-1.5" for="fullname">
        Họ và tên
      </label>
<div class="relative">
<input class="w-full h-11 px-3.5 bg-surface text-primary-text font-body-md text-body-md rounded-[6px] border border-border placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required="" type="text">
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-primary-text font-medium mb-1.5" for="email">
        Email
      </label>
<div class="relative">
<input class="w-full h-11 px-3.5 bg-surface text-primary-text font-body-md text-body-md rounded-[6px] border border-border placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="email" name="email" placeholder="sinhvien@fit.hcmus.edu.vn" required="" type="email">
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-primary-text font-medium mb-1.5" for="password">
        Mật khẩu
      </label>
<div class="relative flex items-center">
<input class="w-full h-11 pl-3.5 pr-11 bg-surface text-primary-text font-body-md text-body-md rounded-[6px] border border-border placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="password" minlength="8" name="password" placeholder="Nhập mật khẩu (tối thiểu 8 ký tự)" required="" type="password">
<button aria-label="Hiện hoặc ẩn mật khẩu" class="absolute right-3 text-secondary-text hover:text-primary-text p-1 flex items-center justify-center transition-colors focus:outline-none" onclick="togglePasswordVisibility('password', 'eye-icon-1')" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon-1">visibility</span>
</button>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-primary-text font-medium mb-1.5" for="confirm-password">
        Xác nhận mật khẩu
      </label>
<div class="relative flex items-center">
<input class="w-full h-11 pl-3.5 pr-11 bg-surface text-primary-text font-body-md text-body-md rounded-[6px] border border-border placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="confirm-password" minlength="8" name="confirm-password" placeholder="Nhập lại mật khẩu" required="" type="password">
<button aria-label="Hiện hoặc ẩn mật khẩu xác nhận" class="absolute right-3 text-secondary-text hover:text-primary-text p-1 flex items-center justify-center transition-colors focus:outline-none" onclick="togglePasswordVisibility('confirm-password', 'eye-icon-2')" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon-2">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full h-[44px] bg-primary-container hover:bg-primary-hover active:bg-primary text-on-primary font-label-md text-label-md font-medium rounded-[6px] transition-colors flex items-center justify-center shadow-sm cursor-pointer" type="submit">
        Đăng ký
      </button>
</div>
</form>
<div class="mt-6 pt-5 border-t border-border text-center">
<p class="font-body-md text-body-md text-secondary-text">
      Đã có tài khoản? 
      <a class="text-primary-container font-medium hover:underline hover:text-primary-hover transition-colors ml-1" href="#">
        Đăng nhập
      </a>
</p>
</div>
</div>
<script>
  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main>



</body></html>
