<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-primary-fixed-variant": "#0d458e", "surface-container-high": "#e8e7ee", "inverse-on-surface": "#f0f0f7", "surface-bright": "#f9f9ff", "primary-hover": "#00336E", "primary": "#002a5e", "inverse-primary": "#acc7ff", "secondary-fixed": "#d3e4fe", "tertiary": "#4f1b00", "secondary-container": "#d0e1fb", "tertiary-fixed-dim": "#ffb695", "tertiary-fixed": "#ffdbcc", "error-container": "#ffdad6", "on-primary-fixed": "#001a40", "outline-variant": "#c3c6d3", "on-tertiary": "#ffffff", "on-surface": "#1a1b20", "primary-fixed": "#d7e2ff", "surface-container-low": "#f3f3fa", "surface-container-lowest": "#ffffff", "error": "#ba1a1a", "surface-dim": "#d9d9e0", "secondary": "#505f76", "surface-variant": "#e2e2e9", "on-primary": "#ffffff", "on-tertiary-fixed": "#351000", "on-surface-variant": "#434751", "secondary-fixed-dim": "#b7c8e1", "on-secondary": "#ffffff", "border": "#E2E8F0", "on-primary-container": "#84adfd", "primary-text": "#1E293B", "on-tertiary-container": "#fb9361", "on-secondary-fixed": "#0b1c30", "surface-container": "#ededf4", "outline": "#737782", "on-background": "#1a1b20", "on-secondary-fixed-variant": "#38485d", "surface-container-highest": "#e2e2e9", "primary-container": "#003f88", "on-secondary-container": "#54647a", "primary-subtle": "#EAF1F9", "on-tertiary-fixed-variant": "#7a3004", "inverse-surface": "#2f3036", "surface-tint": "#305da7", "on-error-container": "#93000a", "surface": "#FFFFFF", "background": "#F8FAFC", "on-error": "#ffffff", "primary-fixed-dim": "#acc7ff", "tertiary-container": "#732b00", "secondary-text": "#64748B" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-lg": "24px", "space-md": "16px", "margin": "24px", "space-sm": "8px", "space-xs": "4px", "gutter": "16px", "space-xl": "32px" }, "fontFamily": { "headline-md": [ "Inter" ], "body-lg": [ "Inter" ], "label-md": [ "Inter" ], "label-sm": [ "Inter" ], "body-md": [ "Inter" ], "headline-lg": [ "Inter" ], "headline-sm": [ "Inter" ] }, "fontSize": { "headline-md": [ "20px", { "lineHeight": "28px", "fontWeight": "600" } ], "body-lg": [ "16px", { "lineHeight": "24px", "fontWeight": "400" } ], "label-md": [ "14px", { "lineHeight": "20px", "fontWeight": "500" } ], "label-sm": [ "12px", { "lineHeight": "16px", "fontWeight": "500" } ], "body-md": [ "14px", { "lineHeight": "20px", "fontWeight": "400" } ], "headline-lg": [ "24px", { "lineHeight": "32px", "fontWeight": "600" } ], "headline-sm": [ "16px", { "lineHeight": "24px", "fontWeight": "600" } ] } } } };</script></head><body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-space-md"><main class="w-full max-w-md bg-surface border border-border rounded-xl p-space-xl shadow-[0_2px_8px_rgba(15,23,42,0.04)]"><div class="flex flex-col w-full">
<div class="flex flex-col items-center text-center mb-6"><div class="flex items-center justify-center gap-3 mb-2"><div class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-primary-container text-white shadow-sm"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div><span class="font-headline-md text-headline-md text-primary-text font-bold tracking-tight">TeamSync</span></div><p class="font-body-md text-body-md text-secondary-text">Hệ thống hỗ trợ làm việc nhóm trực tuyến</p></div>
<div class="w-full">
<h1 class="font-headline-lg text-headline-lg text-primary-text mb-6 font-semibold">
      Đăng nhập
    </h1>
<form class="flex flex-col gap-4" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-primary-text" for="email">
          Email
        </label>
<div class="relative w-full">
<input class="w-full px-3.5 py-2.5 bg-surface text-primary-text font-body-md text-body-md rounded-[6px] border border-border placeholder:text-secondary-text/60 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="email" name="email" placeholder="sinhvien@fit.hcmus.edu.vn" required="" type="email">
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-primary-text" for="password">
            Mật khẩu
          </label>
</div>
<div class="relative w-full">
<input class="w-full pl-3.5 pr-11 py-2.5 bg-surface text-primary-text font-body-md text-body-md rounded-[6px] border border-border placeholder:text-secondary-text/60 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Hiện hoặc ẩn mật khẩu" class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-secondary-text hover:text-primary-text transition-colors flex items-center justify-center focus:outline-none rounded" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px] select-none" id="eyeIcon">
              visibility
            </span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full py-3 px-4 bg-primary-container hover:bg-primary-hover active:bg-primary text-on-primary font-label-md text-label-md font-semibold rounded-[6px] transition-colors flex items-center justify-center gap-2 shadow-sm cursor-pointer" id="submitBtn" type="submit">
<span class="">Đăng nhập</span>
</button>
</div>
</form>
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-secondary-text">
        Chưa có tài khoản? 
        <a class="text-primary-container font-semibold hover:underline transition-all" href="#register">
          Đăng ký
        </a>
</p>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (!passwordInput || !eyeIcon) return;

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLogin() {
    const submitBtn = document.getElementById('submitBtn');
    if (!submitBtn) return;
    
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = `
      <span class="inline-block w-4 h-4 border-2 border-on-primary border-t-transparent rounded-full animate-spin"></span>
      <span>Đang xử lý...</span>
    `;
    submitBtn.setAttribute('disabled', 'true');
    submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

    setTimeout(() => {
      submitBtn.innerHTML = originalText;
      submitBtn.removeAttribute('disabled');
      submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
    }, 1200);
  }
</script></main>

</body></html>
